Q('Your plans',[['What will you do after finishing?','Be realistic and specific.'],['How will this study help your career at home?','Show demand for the skills.'],['Where will you live?','Name an option and area.'],['What ties do you have to your home country?','Family, career, commitments.'],['Do you plan to work while studying?','Know the current work limits.']]),
Q('Tricky ones',[['Have you had a visa refused or cancelled?','Answer honestly and explain.'],['Why is there a gap in your studies?','Honest, short, with proof.'],['Why are you changing fields?','Explain the link or the reason for change.'],['Can you explain your GS answers?','Your spoken answers must match your written ones.'],['Do you have relatives in Australia?','Say who and where. Never hide.']]));
Object.assign(D.uk,{len:'Pre-CAS interviews usually take 15 to 45 minutes and are often online. A UKVI interview can be shorter. Ask your university what to expect.',
walk:[['Before: link and time','The university emails a link, date and rules. Test camera, microphone and internet the day before.'],['Joining: first 5 minutes','Join a few minutes early. You may show your passport to the camera and say your name and application number.'],['Warm-up','Easy questions about you and your education.'],['Main part','Questions about your course, university, money and plans. The officer can see your application, personal statement and documents.'],['Closing','You may be asked if you have questions. Say thank you. Some interviews are recorded.'],['After and visa stage','The university emails the result. Later, UKVI may also contact you during your visa application. Attending is mandatory.']],
day:['Internet and power tested','Camera and microphone working','Quiet, well-lit room with a plain background','Passport ready','Offer, deposit and finance documents open','Dressed neatly','Phone silent, joined 5 minutes early'],
ref:['Documents and spoken answers do not match','Vague or memorised answers about the course','Unclear or unexplained funds','Weak link between past study or work and the course','Gaps or earlier refusals not explained honestly','Missing the interview'],
mn:'Bank statements often need to meet a rule on amount and holding period. Check the current rule on gov.uk.',
ex:['Why this course?','“It is a good course and I like it.”','“I want to study Data Analytics [point]. I worked in sales and saw decisions made without data [reason]. The [module name] module teaches the tools I was missing [example].”']});
Object.assign(D.us,{len:'Usually only a few minutes at a window. You may wait a long time before it starts.',
walk:[['Arrive early','Allow time for the security check. Rules about phones and bags differ, so read your appointment letter.'],['Document check','Staff check your passport and appointment confirmation. Fingerprints may be taken.'],['Waiting','You may wait in a hall for a while. Stay calm.'],['At the window','The officer sees your DS-160, I-20 and SEVIS record, and may review your online presence. You speak in English.'],['Questions','Short and direct. Answer only what is asked.'],['Result','Approved, refused, or more checks needed (administrative processing). Refusals often say you did not show enough ties to home.']],
day:['Appointment confirmation','Passport and signed I-20','DS-160 confirmation page','SEVIS fee receipt','Financial documents in one folder','Social media reviewed and accurate','Dressed neatly, arrive early'],
ref:['Not showing ties to your home country','Unclear sponsor or funds','Not knowing your school or programme','Answers differ from your DS-160 or documents','Memorised or inconsistent answers','Online posts that contradict your application'],
mn:'Be ready to say who pays for the first year and show documents that support it.',
ex:['Why this university?','“It is very famous.”','“I chose [your university] for its [programme] [point]. It offers [lab or course] in the first year [reason]. I read about [project], which links to my past study in [subject] [example].”']});
Object.assign(D.au,{len:'Usually 5 to 15 minutes by video or voice call. It may be scheduled or arranged at short notice.',
walk:[['Notice','You may get an email or call. Check spam and unknown numbers.'],['Joining','Video or voice. Find a quiet room and keep your passport near you.'],['Opening','You confirm your name, passport and identity.'],['Questions','About your course, why Australia, your background, money and plans.'],['What the officer sees','Your application, your GS answers, documents and travel history.'],['After','The decision arrives in your application account or email. You may be asked for more documents.']],
day:['Internet tested and phone charged','Quiet room','Passport and CoE ready','Written GS answers re-read','Finance documents ready','Dressed neatly','Answer unknown calls and check email'],
ref:['Spoken answers do not match your GS answers','Course does not fit your background and goals','Unclear funds','Weak reasons for Australia over studying at home','Unexplained gaps or earlier refusals','Not answering honestly'],
mn:'Check the current living-cost requirement on the Home Affairs website.',
ex:['Why Australia?','“Australia is a good country.”','“I want to study Nursing in Australia [point]. The course includes hospital placements, which my local course does not [reason]. For example, [provider] places students from year one [example].”']});
D.uk.cmp=[['1. Pre-CAS interview (your university)',['Held by the university’s admissions or visa compliance team','Happens after your offer and conditions, before the university issues your CAS','The university checks that you are a genuine student before it sponsors you','Usually an online video call; some are recorded','Only some applicants are chosen, often based on nationality and past history','Pass: the university issues your CAS. Ask the university what happens if you do not pass']],['2. UKVI credibility interview (visa stage)',['Held by a UK Visas and Immigration officer','Happens after you apply for the Student visa, sometimes near your biometrics appointment, by phone or video','Not everyone is asked, and it can come at short notice','It affects the visa decision, and missing it can lead to refusal']]];
D.uk.cn='Prepare once, use twice. Keep a note of what you said in the pre-CAS interview, because your visa application should tell the same story.';
let S={c:null,s:'ov',chk:{},pd:{},dk:{},g:'All',notes:{},qi:{uk:0,us:0,au:0},rev:0};
const gl=k=>D[k].qs.map((q,i)=>i).filter(i=>S.g=='All'||D[k].qs[i][2]==S.g);
try{const x=JSON.parse(localStorage.getItem('ig3'));if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem('ig3',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fl=k=>IC[k],nm=k=>D[k].n.slice(D[k].n.indexOf(' ')+1);
const pct=k=>{const d=D[k];return Math.round((d.docs.filter((_,i)=>S.chk[k+i]).length/d.docs.length+d.qs.filter((_,i)=>S.pd[k+i]).length/d.qs.length)*50)};
const lv=p=>p>=90?'🏆 Interview ready':p>=60?'🚀 Almost there':p>=25?'⭐ Rising star':'🌱 Just starting';
const th=k=>k?`--m:${T[k].m};--a:${T[k].a}`:'';
let tmr=null,sec=0;const stop=()=>{clearInterval(tmr);tmr=null;sec=0};
const fmt=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
function home(){return `<section class="hh"><div class="sk">🎒✈️🌍📚</div><h1>Where are you heading?</h1><p>Pick a country. We’ll get you ready for the interview, one step at a time.</p></section>${Object.keys(D).map(k=>`<button class="cc" data-k="${k}" data-e="${T[k].e}" style="${th(k)}"><span class="bf">${fl(k)}</span><div class="ci"><b>${nm(k)}</b><small>${D[k].t}</small><div class="lvl">${lv(pct(k))}</div><div class="pb"><i style="width:${pct(k)}%"></i></div></div><span class="go">›</span></button>`).join('')}<p class="foot">Your progress saves on this device 💾</p>`}
function body(k){const d=D[k];
 if(S.s=='ov')return `<div class="card"><h3>🤔 What is it?</h3>${d.what.map(p=>`<p>${p}</p>`).join('')}</div>${d.cmp?`<div class="card"><h3>🆚 Pre-CAS vs UKVI interview</h3>${d.cmp.map(c=>`<div class="wk" style="background:var(--t);margin-bottom:10px"><b>${c[0]}</b><ul>${c[1].map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}<p>${d.cn}</p></div>`:''}<div class="card"><h3>👀 What they check</h3><div class="tiles">${d.chk.map(c=>`<div class="tile">⭐ ${c}</div>`).join('')}</div></div><div class="card"><h3>🚩 Common reasons for refusal</h3><ul>${d.ref.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><h3>🔗 Official sources</h3>${d.links.map(l=>`<a class="lk" href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join('')}</div><div class="warn">⚠️ Rules, fees and amounts change often. Always confirm on the official sites and your university’s page.</div>`;
 if(S.s=='st')return `<div class="card"><h3>✈️ Your journey, step by step</h3><div class="tl">${d.steps.map((s,i)=>`<div><i>${SE[i%7]}</i><p style="margin:0"><b>${s[0]}</b><span>${s[1]}</span></p></div>`).join('')}</div></div>`;
 if(S.s=='dc'){const n=d.docs.filter((_,i)=>S.chk[k+i]).length;return `${n==d.docs.length?'<div class="ban">🎉 All documents ready!</div>':''}<div class="card"><h3>📄 ${n} of ${d.docs.length} ready</h3><div class="prog"><i style="width:${n/d.docs.length*100}%"></i></div>${d.docs.map((t,i)=>`<button class="dc ${S.chk[k+i]?'on':''}" data-c="${i}"><em>✓</em><span>${t}</span></button>`).join('')}</div><div class="warn">Needs differ by university and applicant. Ask them or check the official site if unsure.</div>`}
 if(S.s=='iv')return `<div class="card"><h3>🎬 How it goes</h3><div class="tl">${d.walk.map((s,i)=>`<div><i>${SE[i%7]}</i><p style="margin:0"><b>${s[0]}</b><span>${s[1]}</span></p></div>`).join('')}</div></div><div class="card"><h3>⏱ How long?</h3><p>${d.len}</p></div><div class="card"><h3>🎒 Interview day checklist</h3>${d.day.map((t,i)=>`<button class="dc ${S.dk[k+i]?'on':''}" data-dk="${i}"><em>✓</em><span>${t}</span></button>`).join('')}</div><div class="card"><h3>🗣️ Useful English phrases</h3><div class="ph">${PH.map(x=>`<span>${x}</span>`).join('')}</div><p style="margin-top:10px">It is fine to ask for a question to be repeated. Clear and honest beats fast.</p></div>`;
 if(S.s=='pr'){const i=S.qi[k],q=d.qs[i],nk=k+i,dn=S.pd[nk];return `<div class="chips">${GR.map(g=>`<button class="ch ${S.g==g?'on':''}" data-g="${g}">${g}</button>`).join('')}</div><div class="fc"><small>${q[2]} · Question ${i+1} of ${d.qs.length}</small><div class="bub"><span class="mas">${T[k].s}</span><div class="q">${q[0]}</div></div><div class="tm" id="tm">${fmt(sec)}</div><div class="tools"><button class="b" id="tg">${tmr?'⏸ Stop timer':'⏱ Start timer'}</button></div></div><div class="stars">${d.qs.map((_,j)=>S.pd[k+j]?'⭐':'☆').join('')}</div><div class="tools"><button class="b" data-rev="1">💡 ${S.rev?'Hide hint':'Show hint'}</button></div>${S.rev?`<div class="hint">${q[1]}</div>`:''}<textarea id="nt" placeholder="Write your key points in your own words ✍️ (not a script)">${esc(S.notes[nk]||'')}</textarea><div class="tools"><button class="b" data-q="-1">‹ Back</button><button class="b ${dn?'':'pri'}" data-pd="1">${dn?'Nailed it ✓':'🎯 I nailed it'}</button><button class="b" data-q="1">Next ›</button></div>`}
 return `<div class="card"><h3>🧱 Build an answer in 3 parts</h3><div class="pre"><span>Point<small>answer directly</small></span><span>Reason<small>say why</small></span><span>Example<small>a real detail</small></span></div><p><b>Question:</b> ${d.ex[0]}</p><div class="cmp"><div class="wk"><b>😬 Weak</b><p>${d.ex[1]}</p></div><div class="sg"><b>💪 Stronger</b><p>${d.ex[2]}</p></div></div><p style="font-size:13px;margin-top:10px">This shows structure only. Use your own facts and words. Never copy.</p></div><div class="card"><h3>💰 Money, explained simply</h3><ul>${MONEY.map(x=>`<li>${x}</li>`).join('')}</ul><p style="margin-top:8px">${d.mn}</p></div><div class="two"><div class="card ok"><h3>✅ Do</h3><ul>${d.dos.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card no"><h3>🚫 Don’t</h3><ul>${d.don.map(x=>`<li>${x}</li>`).join('')}</ul></div></div><div class="warn">💬 Interviewers want your real story. Memorised answers sound unnatural and can hurt you.</div>`}
function render(){const k=S.c,a=$('#app'),nv=$('#nv'),r=document.documentElement.style,x=T[k||'home'];
 r.setProperty('--m',x.m);r.setProperty('--a',x.a);r.setProperty('--t',x.t);
 if(!k){a.innerHTML=home();nv.hidden=true;return}
 a.innerHTML=`<div class="top" data-e="${T[k].e}"><button class="back" data-home="1">‹ All countries</button><div class="row"><span class="bf">${fl(k)}</span><h2>${D[k].t}</h2></div><div class="lvl">${lv(pct(k))} · ${pct(k)}%</div><div class="pb"><i style="width:${pct(k)}%"></i></div></div>${body(k)}`;
 nv.hidden=false;nv.innerHTML=SEC.map(s=>`<button aria-selected="${S.s==s[0]}" data-s="${s[0]}"><span>${s[1]}</span>${s[2]}</button>`).join('')}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const o=t.dataset;
 if(o.k){stop();S.c=o.k;S.s='ov'}else if(o.home){stop();S.c=null}else if(o.s){stop();S.s=o.s}
 else if(o.c!==undefined){const x=S.c+o.c;S.chk[x]?delete S.chk[x]:S.chk[x]=1}
 else if(t.id=='tg'){if(tmr)stop();else tmr=setInterval(()=>{sec++;const m=$('#tm');if(m)m.textContent=fmt(sec)},1000);t.textContent=tmr?'⏸ Stop timer':'⏱ Start timer';return}
 else if(o.rev)S.rev=S.rev?0:1;
 else if(o.pd){const x=S.c+S.qi[S.c];S.pd[x]?delete S.pd[x]:S.pd[x]=1}
 else if(o.q){const l=gl(S.c),p=l.indexOf(S.qi[S.c]);S.qi[S.c]=l[((p<0?0:p)+ +o.q+l.length)%l.length];S.rev=0;stop()}else if(o.g){S.g=o.g;S.qi[S.c]=gl(S.c)[0];S.rev=0;stop()}else if(o.dk!==undefined){const y=S.c+o.dk;S.dk[y]?delete S.dk[y]:S.dk[y]=1}
 else return;
 save();render();window.scrollTo({top:0})});
document.addEventListener('change',e=>{if(e.target.id=='nt'){S.notes[S.c+S.qi[S.c]]=e.target.value;save()}});
render();
</script>
